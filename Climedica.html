<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Climédica · Seguimiento institucional v0.5</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#173348;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:235px;background:#14374b;color:white;padding:24px 13px;flex-shrink:0}.brand{font-size:23px;font-weight:800;padding:0 12px}.sub{font-size:12px;color:#b9cbd4;padding:6px 12px 22px}.nav{display:block;width:100%;background:none;color:#dbe9ee;border:0;border-radius:8px;text-align:left;padding:12px;margin:2px 0}.nav.on,.nav:hover{background:#28576e;color:#fff}.main{padding:25px 30px;flex:1;min-width:0;max-width:1500px}h1{margin:0;font-size:25px}h2{font-size:18px;margin:0 0 13px}h3{font-size:15px;margin:0 0 9px}.muted{color:#687e8d}.small{font-size:12px}.top,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{justify-content:space-between}.panel,.stat{background:white;border:1px solid #dce6ec;border-radius:12px;padding:17px;box-shadow:0 2px 8px #132e4006}.panel{margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:17px 0}.stat b{display:block;font-size:29px;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.split{display:grid;grid-template-columns:minmax(290px,1fr) minmax(310px,1.1fr);gap:15px}.item{border:1px solid #dde7ec;border-radius:9px;padding:12px;margin:9px 0;background:white}.item.click{cursor:pointer}.item.click:hover{border-color:#6e9caf}.item.selected{border:2px solid #1b7895}.priority-red{border-left:6px solid #c53939}.priority-orange{border-left:6px solid #e78325}.priority-yellow{border-left:6px solid #e6bb3d}.priority-green{border-left:6px solid #399768}.badge{display:inline-block;padding:5px 9px;border-radius:30px;font-size:11px;font-weight:750;background:#e9f1f5;color:#31566c}.badge.red{background:#fde6e5;color:#a62626}.badge.orange{background:#fff0db;color:#9b5217}.badge.yellow{background:#fff7d9;color:#80620c}.badge.green{background:#e3f5e9;color:#1e7649}.btn{border:0;border-radius:8px;background:#14718d;color:white;padding:10px 13px;font-weight:650}.btn.alt{background:#e8f0f4;color:#1e536c}.btn.danger{background:#fbe6e5;color:#a13232}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd9e0;border-radius:7px;background:#fff;color:#173348}textarea{min-height:65px}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px;color:#526b7b}.notice{background:#fff4da;border:1px solid #efd79b;padding:12px 14px;border-radius:9px;margin:16px 0}.hint{font-size:12px;color:#6a8190;line-height:1.5}.line{border:0;border-top:1px solid #e2ebef;margin:15px 0}.history{border-left:2px solid #c7dce6;padding:8px 0 8px 13px;margin:8px 0}.empty{padding:23px;text-align:center;color:#738894;background:#f5f8fa;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e2eaf0;text-align:left}th{background:#f4f7f9}.scroll{overflow:auto}.note{font-size:12px;color:#718390}.inline{width:auto;min-width:175px}.check{width:auto}.section{margin-top:16px}.caps{letter-spacing:.04em;text-transform:uppercase;font-size:11px;color:#738997;font-weight:700}@media(max-width:850px){.app{display:block}.side{width:100%;padding:12px}.brand,.sub{display:inline-block}.sub{padding:0 8px}.nav{display:inline-block;width:auto;padding:9px}.main{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.grid,.split{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">CLIMÉDICA</div><div class="sub">Control institucional · v0.5</div><div id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Panel general</h1><div class="muted small">Seguimiento administrativo por internación</div></div><span class="badge orange">DEMO · DATOS FICTICIOS</span></div><div class="notice">Prototipo local sin integración con Open Médica, correo ni usuarios institucionales. Los cambios se guardan en este navegador. No cargues datos reales de pacientes.</div><div id="view"></div></main></div><script>
'use strict';
const KEY='climedica_v05_demo';const CLASS=['Factura por historia clínica','Requiere autorización','Requiere presupuesto','Requiere ambas'];const STATES=['PENDIENTE DOCUMENTACIÓN','ENVIADO – SIN RESPUESTA','RECLAMADO','OBSERVADO','AUTORIZADO','AUTORIZADO PARCIAL','RECHAZADO','REPROGRAMADO','CANCELADO'];const SECTORS=['Secretaría de Piso','Presupuestos','Auditoría Médica','Facturación','Admisión','Quirófano','Débitos','Sistemas'];const menu=[['home','Panel general'],['work','Bandeja por sector'],['episodes','Internaciones'],['create','Nueva gestión'],['discharge','Control de egresos'],['decisions','Resoluciones institucionales'],['history','Historial'],['about','Integración y límites']];const today=()=>new Date().toISOString().slice(0,10);function dateShift(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function agoHours(h){return new Date(Date.now()-h*3600000).toISOString()}const sample={episodes:[{id:'INT-DEMO-001',hc:'HC-DEMO-101',patient:'Paciente ficticia A',os:'Cobertura Alfa',surgery:dateShift(1),discharge:'',transfer:{},decision:null},{id:'INT-DEMO-002',hc:'HC-DEMO-102',patient:'Paciente ficticio B',os:'Cobertura Beta',surgery:dateShift(2),discharge:'',transfer:{},decision:null},{id:'INT-DEMO-003',hc:'HC-DEMO-103',patient:'Paciente ficticia C',os:'Cobertura Gamma',surgery:'',discharge:agoHours(28),transfer:{},decision:null},{id:'INT-DEMO-004',hc:'HC-DEMO-104',patient:'Paciente ficticio D',os:'Cobertura Alfa',surgery:'',discharge:agoHours(54),transfer:{},decision:null}],tasks:[{id:'GES-001',episode:'INT-DEMO-001',type:'Cirugía',practice:'Cirugía programada (ejemplo)',classification:'Requiere ambas',practiceStatus:'ENVIADO – SIN RESPUESTA',budgetStatus:'RECLAMADO',notes:'',created:agoHours(48)},{id:'GES-002',episode:'INT-DEMO-002',type:'Cirugía',practice:'Procedimiento programado (ejemplo)',classification:'Requiere autorización',practiceStatus:'ENVIADO – SIN RESPUESTA',budgetStatus:'',notes:'',created:agoHours(30)},{id:'GES-003',episode:'INT-DEMO-003',type:'Estudio',practice:'Estudio complementario (ejemplo)',classification:'Requiere presupuesto',practiceStatus:'',budgetStatus:'ENVIADO – SIN RESPUESTA',notes:'',created:agoHours(72)},{id:'GES-004',episode:'INT-DEMO-004',type:'Cirugía',practice:'Procedimiento realizado (ejemplo)',classification:'Requiere autorización',practiceStatus:'RECLAMADO',budgetStatus:'',notes:'',created:agoHours(96)}],audit:[]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(sample)}catch{state=structuredClone(sample)}let page='home',role='Secretaría de Piso',selected='GES-001',epSelected='INT-DEMO-001',msg='';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opts=(arr,val)=>arr.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('');const E=id=>state.episodes.find(x=>x.id===id);const T=id=>state.tasks.find(x=>x.id===id);const save=()=>localStorage.setItem(KEY,JSON.stringify(state));function log(id,action){state.audit.unshift({id,action,role,at:new Date().toISOString()});save()}const active=s=>!!s&&!['AUTORIZADO','RECHAZADO','CANCELADO'].includes(s);const needsP=t=>['Requiere autorización','Requiere ambas'].includes(t.classification);const needsB=t=>['Requiere presupuesto','Requiere ambas'].includes(t.classification);const pendingP=t=>needsP(t)&&active(t.practiceStatus);const pendingB=t=>needsB(t)&&active(t.budgetStatus);const pending=t=>pendingP(t)||pendingB(t);function daysUntil(s){if(!s)return 999;let d=new Date(s+'T12:00:00'),n=new Date();n.setHours(12,0,0,0);return Math.round((d-n)/86400000)}function hoursSince(s){return s?(Date.now()-new Date(s).getTime())/3600000:0}function priority(t){let e=E(t.episode);if(!pending(t))return 'green';if(e.discharge){return hoursSince(e.discharge)>=40?'red':hoursSince(e.discharge)>=24?'orange':'yellow'}if(t.type==='Cirugía'&&e.surgery&&daysUntil(e.surgery)<=1)return 'red';if(t.type==='Cirugía'&&e.surgery&&daysUntil(e.surgery)<=3)return 'orange';return 'yellow'}const rank={red:0,orange:1,yellow:2,green:3};const names={red:'Crítico',orange:'Atención',yellow:'Seguimiento',green:'Resuelto'};function badge(p){return `<span class="badge ${p}">${names[p]}</span>`}function sectors(t){let a=[];if(pendingP(t))a.push('Secretaría de Piso');if(pendingB(t))a.push('Presupuestos');if(t.type==='Cirugía'&&E(t.episode).surgery&&daysUntil(E(t.episode).surgery)<=1&&pending(t))a.push('Auditoría Médica');return [...new Set(a)]}function open(p){page=p;msg='';render()}function render(){document.getElementById('nav').innerHTML=menu.map(([id,n])=>`<button class="nav ${page===id?'on':''}" onclick="open('${id}')">${n}</button>`).join('');document.getElementById('title').textContent=menu.find(x=>x[0]===page)?.[1];document.getElementById('view').innerHTML=`<div class="panel"><div class="row"><b>Vista sectorial simulada:</b><select class="inline" onchange="role=this.value;render()">${opts(SECTORS,role)}</select><span class="hint">No representa permisos reales.</span></div></div>${msg?`<div class="notice">${esc(msg)}</div>`:''}`+({home,work,episodes,create,discharge,decisions,history,about}[page])()}
function home(){let pendingTasks=state.tasks.filter(pending),critical=pendingTasks.filter(t=>priority(t)==='red'),dis=state.episodes.filter(e=>e.discharge);return `<div class="stats"><div class="stat"><span class="muted small">Internaciones</span><b>${state.episodes.length}</b></div><div class="stat"><span class="muted small">Gestiones pendientes</span><b>${pendingTasks.length}</b></div><div class="stat"><span class="muted small">Prioridad roja</span><b>${critical.length}</b></div><div class="stat"><span class="muted small">Egresos a controlar</span><b>${dis.length}</b></div></div><div class="grid"><div class="panel"><h2>Prioridades del día</h2>${critical.length?critical.map(t=>taskCard(t)).join(''):'<div class="empty">No hay gestiones críticas.</div>'}<button class="btn alt" onclick="open('work')">Abrir bandeja</button></div><div class="panel"><h2>Reglas operativas</h2><p>Las solicitudes se clasifican manualmente en cuatro categorías. Las respuestas y autorizaciones se validan y actualizan manualmente.</p><p>Las cirugías próximas con pendientes se visualizan en Auditoría Médica y en los sectores responsables, sin generar correos.</p><p>Al egreso, Secretaría de Piso y Presupuestos mantienen el seguimiento y transfieren la documentación a Facturación dentro de las 48 horas.</p><p class="hint">La fecha de cirugía, el egreso y los estados son datos de prueba cargados localmente. La integración con Open Médica está pendiente de Sistemas.</p></div></div>`}
function taskCard(t){let e=E(t.episode),p=priority(t);return `<div class="item click priority-${p} ${selected===t.id?'selected':''}" onclick="selected='${t.id}';open('work')"><div class="top"><b>${esc(e.patient)} · ${esc(t.practice)}</b>${badge(p)}</div><div class="small muted">${esc(e.id)} · ${esc(e.os)} · ${esc(t.classification)}</div><div class="small">${e.surgery?'Cirugía: '+esc(e.surgery)+' · ':''}Práctica: ${esc(t.practiceStatus||'No aplica')} · Presupuesto: ${esc(t.budgetStatus||'No aplica')}</div></div>`}
function work(){let list=state.tasks.filter(t=>role==='Sistemas'||role==='Facturación'||role==='Débitos'||sectors(t).includes(role)||(role==='Quirófano'&&t.type==='Cirugía')||(role==='Admisión'&&E(t.episode).discharge));list.sort((a,b)=>rank[priority(a)]-rank[priority(b)]);let t=T(selected);if(!t||!list.some(x=>x.id===selected))t=list[0];return `<div class="panel"><div class="top"><h2>Bandeja de ${esc(role)}</h2><span class="hint">Los colores son prioridades, no estados de autorización.</span></div><div class="split"><div>${list.length?list.map(taskCard).join(''):'<div class="empty">No hay gestiones para esta vista.</div>'}</div><div>${t?taskDetail(t):'<div class="empty">Seleccioná una gestión.</div>'}</div></div></div>`}
function taskDetail(t){let e=E(t.episode);return `<div class="panel"><h3>${esc(t.id)} · ${esc(t.practice)}</h3><p class="small"><b>Paciente:</b> ${esc(e.patient)}<br><b>Internación:</b> ${esc(e.id)} · HC: ${esc(e.hc)}<br><b>Obra social:</b> ${esc(e.os)}<br><b>Clasificación:</b> ${esc(t.classification)}<br><b>Cirugía:</b> ${esc(e.surgery||'Sin fecha')}<br><b>Egreso:</b> ${esc(e.discharge?new Date(e.discharge).toLocaleString('es-AR'):'No registrado')}</p>${t.classification==='Factura por historia clínica'?'<p class="hint">Sin gestión activa: permanece en el historial de la internación.</p>':`<label>Estado de autorización de práctica</label><select id="ps" ${!needsP(t)?'disabled':''}>${opts(needsP(t)?STATES:['NO APLICA'],t.practiceStatus||'NO APLICA')}</select><label>Estado de presupuesto</label><select id="bs" ${!needsB(t)?'disabled':''}>${opts(needsB(t)?STATES:['NO APLICA'],t.budgetStatus||'NO APLICA')}</select><label>Observación administrativa breve</label><textarea id="notes">${esc(t.notes)}</textarea><button class="btn" onclick="updateTask('${esc(t.id)}')">Guardar estado manual</button>`}<p class="hint">Las autorizaciones y sus respaldos se conservan en Open Médica y/o correos originales. Esta demo no envía ni lee mensajes.</p></div>`}
function updateTask(id){let t=T(id);if(!t)return;let a=t.practiceStatus,b=t.budgetStatus;t.practiceStatus=needsP(t)?document.getElementById('ps').value:'';t.budgetStatus=needsB(t)?document.getElementById('bs').value:'';t.notes=document.getElementById('notes').value;log(id,`Estados actualizados: práctica ${a||'N/A'} → ${t.practiceStatus||'N/A'}; presupuesto ${b||'N/A'} → ${t.budgetStatus||'N/A'}`);msg='Actualización registrada manualmente.';render()}
function episodes(){let e=E(epSelected)||state.episodes[0];return `<div class="panel"><div class="top"><h2>Expedientes por internación</h2><button class="btn alt" onclick="open('create')">Agregar gestión</button></div><div class="split"><div>${state.episodes.map(x=>`<div class="item click ${e.id===x.id?'selected':''}" onclick="epSelected='${esc(x.id)}';render()"><b>${esc(x.patient)}</b><div class="small muted">${esc(x.id)} · HC ${esc(x.hc)} · ${esc(x.os)}</div><div class="small">${x.discharge?'Egresó':'Internación activa'} · ${state.tasks.filter(t=>t.episode===x.id).length} gestiones</div></div>`).join('')}</div><div><div class="panel"><h3>${esc(e.patient)}</h3><div class="small muted">${esc(e.id)} · ${esc(e.hc)} · ${esc(e.os)}</div><label>Fecha de cirugía programada</label><input id="surgery" type="date" value="${esc(e.surgery)}"><label>Fecha y hora de egreso</label><input id="exit" type="datetime-local" value="${esc(e.discharge?e.discharge.slice(0,16):'')}"><button class="btn" style="margin-top:10px" onclick="updateEpisode('${esc(e.id)}')">Guardar fechas de demostración</button><hr class="line"><h3>Historial de gestiones</h3>${state.tasks.filter(t=>t.episode===e.id).map(t=>`<div class="item"><b>${esc(t.practice)}</b> · ${esc(t.classification)}<div class="small">${esc(t.id)} · ${pending(t)?'Pendiente':'Sin gestión activa'}</div></div>`).join('')||'<div class="empty">Sin gestiones</div>'}</div></div></div></div>`}
function updateEpisode(id){let e=E(id),s=e.surgery,d=e.discharge;e.surgery=document.getElementById('surgery').value;e.discharge=document.getElementById('exit').value?new Date(document.getElementById('exit').value).toISOString():'';log(id,`Fechas actualizadas (cirugía ${s||'-'} → ${e.surgery||'-'}; egreso ${d||'-'} → ${e.discharge||'-'})`);msg='Fechas actualizadas para la demostración.';render()}
function create(){return `<div class="grid"><div class="panel"><h2>Nueva gestión en internación existente</h2><label>Internación</label><select id="newEp">${state.episodes.map(e=>`<option value="${esc(e.id)}">${esc(e.patient)} · ${esc(e.id)}</option>`).join('')}</select><label>Tipo</label><select id="newType">${opts(['Cirugía','Estudio','Laboratorio','Imágenes','Materiales','Prórroga','Hemoterapia','Diálisis','Otro'],'Cirugía')}</select><label>Práctica / descripción</label><input id="newPractice" placeholder="Ej.: estudio complementario"><label>Clasificación administrativa</label><select id="newClass">${opts(CLASS,'Requiere autorización')}</select><button class="btn" style="margin-top:13px" onclick="addTask()">Registrar gestión</button></div><div class="panel"><h2>Reglas de clasificación</h2><p><b>Factura por historia clínica:</b> queda en el historial sin tarea activa.</p><p><b>Requiere autorización:</b> seguimiento de Secretaría de Piso.</p><p><b>Requiere presupuesto:</b> seguimiento de Presupuestos.</p><p><b>Requiere ambas:</b> dos estados independientes dentro de una misma gestión.</p><p class="hint">No se crean registros por cada correo. Las reglas de cada cobertura se verifican manualmente.</p></div></div>`}
function addTask(){let practice=document.getElementById('newPractice').value.trim();if(!practice){msg='Ingresá una descripción ficticia de la práctica.';render();return}let c=document.getElementById('newClass').value,id='GES-'+String(Date.now()).slice(-8);let t={id,episode:document.getElementById('newEp').value,type:document.getElementById('newType').value,practice,classification:c,practiceStatus:['Requiere autorización','Requiere ambas'].includes(c)?'PENDIENTE DOCUMENTACIÓN':'',budgetStatus:['Requiere presupuesto','Requiere ambas'].includes(c)?'PENDIENTE DOCUMENTACIÓN':'',notes:'',created:new Date().toISOString()};state.tasks.push(t);log(id,'Gestión clasificada: '+c);selected=id;msg='Gestión incorporada a la internación.';open('episodes');msg='Gestión incorporada a la internación.';render()}
function discharge(){let es=state.episodes.filter(e=>e.discharge).sort((a,b)=>new Date(b.discharge)-new Date(a.discharge));return `<div class="panel"><h2>Control administrativo posterior al egreso</h2><p class="hint">El seguimiento continúa en Secretaría de Piso y Presupuestos. Facturación recibe el cierre documental; no asume los reclamos. El límite de referencia es de 48 horas posteriores al egreso.</p>${es.map(e=>{let ts=state.tasks.filter(t=>t.episode===e.id),p=ts.filter(pending),h=hoursSince(e.discharge),c=h>=40?'red':h>=24?'orange':'yellow';return `<div class="item priority-${c}"><div class="top"><b>${esc(e.patient)} · ${esc(e.id)}</b><span class="badge ${c}">${Math.round(h)} h desde egreso</span></div><div class="small muted">${esc(e.os)} · ${new Date(e.discharge).toLocaleString('es-AR')}</div><p class="small">Pendientes de autorización: ${p.filter(pendingP).length} · Pendientes de presupuesto: ${p.filter(pendingB).length}</p><div class="grid">${['Secretaría de Piso','Presupuestos'].map(s=>{let involved=p.filter(t=>s==='Secretaría de Piso'?pendingP(t):pendingB(t));let transferred=e.transfer?.[s];return `<div class="item"><b>${s}</b><div class="small">${involved.length} gestiones pendientes</div><div class="small">${transferred?'Transferido: '+new Date(transferred.at).toLocaleString('es-AR'):'Transferencia no registrada'}</div><button class="btn alt" style="margin-top:8px" onclick="transfer('${esc(e.id)}','${s}')">Registrar transferencia</button></div>`}).join('')}</div><p class="hint">El correo consolidado se prepara y envía fuera de Climédica. La transferencia registra la entrega, no convierte pendientes en autorizados.</p></div>`}).join('')||'<div class="empty">No hay egresos registrados.</div>'}</div>`}
function transfer(id,s){let e=E(id);if(!confirm('¿Confirmás que '+s+' envió a Facturación los respaldos de '+e.patient+' por los canales habituales?'))return;e.transfer=e.transfer||{};e.transfer[s]={at:new Date().toISOString(),role};log(id,'Transferencia documental a Facturación registrada por '+s);msg='Transferencia registrada. Las gestiones pendientes conservan su estado.';render()}
function decisions(){let e=E(epSelected)||state.episodes[0];return `<div class="panel"><h2>Resoluciones institucionales</h2><p class="hint">Registro de decisiones comunicadas por los responsables institucionales. La competencia entre Auditoría Médica y Gerencia Comercial está pendiente de definición. Este módulo no autoriza cirugías ni sustituye decisiones clínicas.</p><label>Internación</label><select onchange="epSelected=this.value;render()">${state.episodes.map(x=>`<option value="${esc(x.id)}" ${x.id===e.id?'selected':''}>${esc(x.patient)} · ${esc(x.id)}</option>`).join('')}</select><div class="grid"><div><label>Sector que emitió la resolución</label><select id="decSector">${opts(['Sin definir','Auditoría Médica','Gerencia Comercial','Dirección Médica'],e.decision?.sector||'Sin definir')}</select><label>Estado de resolución</label><select id="decStatus">${opts(['Pendiente de definición','En evaluación','Resolución comunicada'],e.decision?.status||'Pendiente de definición')}</select><label>Resolución y fundamento (sin datos sensibles reales)</label><textarea id="decText">${esc(e.decision?.text||'')}</textarea><button class="btn" onclick="saveDecision('${esc(e.id)}')">Guardar registro</button></div><div><h3>Última resolución registrada</h3>${e.decision?`<div class="item"><b>${esc(e.decision.status)}</b><p>${esc(e.decision.sector)}</p><p>${esc(e.decision.text)}</p><div class="hint">${esc(e.decision.role)} · ${new Date(e.decision.at).toLocaleString('es-AR')}</div></div>`:'<div class="empty">Sin resolución registrada.</div>'}<p class="hint">La decisión institucional y la autorización de la obra social son conceptos independientes.</p></div></div></div>`}
function saveDecision(id){let e=E(id),sector=document.getElementById('decSector').value,status=document.getElementById('decStatus').value,txt=document.getElementById('decText').value.trim();if(status==='Resolución comunicada'&&(sector==='Sin definir'||!txt)){msg='Para registrar una resolución comunicada indicá sector y fundamento.';render();return}e.decision={sector,status,text:txt,role,at:new Date().toISOString()};log(id,'Resolución institucional: '+status+' · '+sector);msg='Resolución registrada en el expediente.';render()}
function history(){return `<div class="panel"><h2>Historial de modificaciones</h2>${state.audit.length?state.audit.map(a=>`<div class="history"><b>${esc(a.action)}</b><div class="small muted">${esc(a.id)} · ${esc(a.role)} · ${new Date(a.at).toLocaleString('es-AR')}</div></div>`).join(''):'<div class="empty">Sin modificaciones registradas todavía.</div>'}</div>`}
function about(){return `<div class="panel"><h2>Alcance de esta versión</h2><p>Esta versión funciona en un único navegador, sin servidor, base compartida, autenticación, permisos verificables ni acceso a datos clínicos reales.</p><h3>Integraciones pendientes de verificar con Sistemas</h3><p>Identificador de episodio de internación; órdenes y alertas de Open Médica; Libro de Quirófanos y cambios de fecha; egresos; módulo de Presupuestos y sus estados; DOCUMENTOS de historia clínica; datos necesarios para Facturación.</p><h3>Definiciones institucionales pendientes</h3><p>Competencias y permisos para decisiones por obra social; validación con Facturación del envío consolidado por sector e internación; plazos y umbrales definitivos de colores; circuito de recepción documental.</p><h3>Resguardo de datos</h3><p>Para usarlo con pacientes reales se requiere alojamiento institucional seguro, control de accesos en servidor, registro de auditoría protegido, copias de seguridad, políticas de conservación y validación de seguridad y privacidad.</p><div class="row"><button class="btn alt" onclick="exportDemo()">Exportar datos ficticios</button><button class="btn danger" onclick="resetDemo()">Restablecer demostración</button></div></div>`}
function exportDemo(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='climedica_v05_demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function resetDemo(){if(!confirm('¿Restablecer todos los datos ficticios?'))return;state=structuredClone(sample);save();msg='Demostración restablecida.';render()}render();
</script></body></html>
